name: CI

# Runs on every pull request and on pushes to main. Every job starts a
# brand-new GitHub Actions runner with its own disposable Docker daemon -
# there is no persistent/retained database here, so "npm run db:start"
# (which always boots a fresh local Supabase stack and applies every
# migration from zero) is exactly the isolated, from-scratch stack this
# project's own test scripts already assume. CI never touches, and has no
# way to touch, anyone's real local or self-hosted deployment.
on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  static:
    name: Static checks (typecheck, lint, format, secrets, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Client-secret scan (fails if a server-only secret reaches the client bundle)
        run: npm run security:client-secrets
      - name: Production build
        run: npm run build
        env:
          # A placeholder local Supabase URL/key is enough for `next build`
          # (no live database call happens at build time) - never a real
          # project's credentials.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55421
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  database:
    name: Database suite (migrations from zero + RLS + domain pgTap suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start a fresh local Supabase stack (applies migrations 000001 -> latest from zero)
        run: npm run db:start
      - run: npm run test:rls
      - run: npm run test:identity
      - run: npm run test:phenotyping
      - run: npm run test:media
      - run: npm run test:workflows
      - run: npm run test:import-export
      - run: npm run test:business-completion
      - run: npm run test:auth-rate-limiting
      - name: Stop the disposable stack (runner is torn down regardless; this just frees Docker resources for later steps/jobs)
        if: always()
        run: npm run db:stop

  integration-e2e:
    name: Integration + E2E (critical user paths)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Start a fresh local Supabase stack (applies migrations 000001 -> latest from zero)
        run: npm run db:start
      - name: Point this checkout's local config at the stack just started
        run: npm run local:configure
      - name: Build against the disposable stack's local config
        run: npm run build
      - run: npm run test:auth
      - run: npm run test:breeding
      - run: npm run test:phenotypes
      - run: npm run test:inventory
      - run: npm run test:operations
      - name: Critical-path E2E (Playwright starts/reuses the production server itself)
        run: npm run test:e2e
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      - name: Stop the disposable stack
        if: always()
        run: npm run db:stop
